{# Cursor pagination controls for gRPC-backed changelists. #}
{% load i18n %}

<div class="grpc-cursor-pagination">
    {% if cl.cursor_next_url %}
    <a href="{{ cl.cursor_next_url }}" class="grp-button cursor-next">
        {% trans "Next" %} →
    </a>
    {% else %}
    <span class="grp-button disabled cursor-next">
        {% trans "Next" %} →
    </span>
    {% endif %}
</div>
