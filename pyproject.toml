[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-admin-grpc"
version = "0.2.2"

description = "Django Admin backed by gRPC services — no ORM required."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    {name = "Dang Van Nghiem",email = "vannghiem848@gmail.com"}
]
keywords = ["django", "grpc", "admin", "microservices"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=5.0,<7.0",
    "grpcio>=1.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "django-stubs>=5.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/DVNghiem/django-admin-grpc"
Documentation = "https://github.com/DVNghiem/django-admin-grpc#readme"
Repository = "https://github.com/DVNghiem/django-admin-grpc"

[tool.hatch.build.targets.wheel]
packages = ["src/django_admin_grpc"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=django_admin_grpc --cov-report=term-missing --cov-fail-under=80"
